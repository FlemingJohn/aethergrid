<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#00c784"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bgGradient)"/>

  <!-- Outer Border -->
  <rect x="20" y="20" width="920" height="500" rx="16" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Title -->
  <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">
    AetherGrid <tspan fill="#00e599">System Architecture</tspan>
  </text>
  <text x="50" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#a1a1aa">
    Portaldot V3.0 On-Chain Energy Telemetry Verification &amp; vREC Token Settlement
  </text>

  <!-- Box 1: Edge Simulation Layer -->
  <rect x="50" y="130" width="260" height="340" rx="12" fill="#18181c" stroke="#2e2e34" stroke-width="1.5"/>
  <rect x="50" y="130" width="260" height="40" rx="12" fill="#202026"/>
  <text x="70" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#00e599">
    01 · EDGE SENSORS (PYTHON SDK)
  </text>
  
  <rect x="70" y="190" width="220" height="65" rx="8" fill="#111114" stroke="#27272a"/>
  <text x="85" y="215" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Inverter-Alpha (Solar PV)</text>
  <text x="85" y="235" font-family="monospace" font-size="11" fill="#a1a1aa">5.5 kW · ECDSA Keypair</text>

  <rect x="70" y="270" width="220" height="65" rx="8" fill="#111114" stroke="#27272a"/>
  <text x="85" y="295" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Storage-Beta (BESS Battery)</text>
  <text x="85" y="315" font-family="monospace" font-size="11" fill="#a1a1aa">13.5 kW · 78% SoC</text>

  <rect x="70" y="350" width="220" height="65" rx="8" fill="#111114" stroke="#27272a"/>
  <text x="85" y="375" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Solar-Gamma (Commercial)</text>
  <text x="85" y="395" font-family="monospace" font-size="11" fill="#a1a1aa">22.0 kW · Nonce Tracker</text>

  <text x="70" y="445" font-family="monospace" font-size="11" fill="#00e599">
    signReading(nonce, kWh, time)
  </text>

  <!-- Arrow 1 to 2 -->
  <path d="M 310 300 L 370 300" stroke="#00e599" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="370,300 362,295 362,305" fill="#00e599"/>
  <text x="315" y="285" font-family="monospace" font-size="10" fill="#a1a1aa">Signed Extrinsic</text>

  <!-- Box 2: Portaldot On-Chain Core -->
  <rect x="370" y="130" width="280" height="340" rx="12" fill="#18181c" stroke="#00e599" stroke-width="1.5"/>
  <rect x="370" y="130" width="280" height="40" rx="12" fill="#202026"/>
  <text x="390" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#00e599">
    02 · PORTALDOT V3.0 EVM (420420777)
  </text>

  <rect x="390" y="190" width="240" height="110" rx="8" fill="#111114" stroke="#27272a"/>
  <text x="405" y="215" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">EnergyRegistry.sol</text>
  <text x="405" y="238" font-family="sans-serif" font-size="11" fill="#00e599">✓ ecrecover signature check</text>
  <text x="405" y="258" font-family="sans-serif" font-size="11" fill="#00e599">✓ Monotonic nonce &amp; kWh check</text>
  <text x="405" y="278" font-family="sans-serif" font-size="11" fill="#00e599">✓ Prevents double-spend fraud</text>

  <path d="M 510 300 L 510 340" stroke="#00e599" stroke-width="2"/>
  <polygon points="510,340 505,332 515,332" fill="#00e599"/>
  <text x="520" y="325" font-family="monospace" font-size="10" fill="#a1a1aa">Mints</text>

  <rect x="390" y="340" width="240" height="85" rx="8" fill="#111114" stroke="#27272a"/>
  <text x="405" y="365" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">EnergyCreditToken.sol</text>
  <text x="405" y="388" font-family="sans-serif" font-size="11" fill="#a1a1aa">ERC-20 Token: vREC</text>
  <text x="405" y="408" font-family="monospace" font-size="11" fill="#00e599">1 kWh = 1 vREC</text>

  <text x="390" y="450" font-family="monospace" font-size="10" fill="#a1a1aa">
    RPC: test-evm-rpc-v3.portaldot.dev
  </text>

  <!-- Arrow 2 to 3 -->
  <path d="M 650 300 L 710 300" stroke="#00e599" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="710,300 702,295 702,305" fill="#00e599"/>
  <text x="655" y="285" font-family="monospace" font-size="10" fill="#a1a1aa">JSON-RPC / Web3</text>

  <!-- Box 3: User & DApp Layer -->
  <rect x="710" y="130" width="200" height="340" rx="12" fill="#18181c" stroke="#2e2e34" stroke-width="1.5"/>
  <rect x="710" y="130" width="200" height="40" rx="12" fill="#202026"/>
  <text x="725" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#00e599">
    03 · DASHBOARD
  </text>

  <rect x="725" y="190" width="170" height="65" rx="8" fill="#111114" stroke="#27272a"/>
  <text x="735" y="215" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">MetaMask Wallet</text>
  <text x="735" y="235" font-family="monospace" font-size="11" fill="#00e599">Chain 420420777</text>

  <rect x="725" y="270" width="170" height="65" rx="8" fill="#111114" stroke="#27272a"/>
  <text x="735" y="295" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Live Audit Table</text>
  <text x="735" y="315" font-family="monospace" font-size="11" fill="#a1a1aa">Explorer Links</text>

  <rect x="725" y="350" width="170" height="65" rx="8" fill="#111114" stroke="#27272a"/>
  <text x="735" y="375" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">vREC Balances</text>
  <text x="735" y="395" font-family="monospace" font-size="11" fill="#00e599">Instant Yield</text>
</svg>
